<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="数字怀仁 Logo">
  <defs>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8553f"/>
      <stop offset="1" stop-color="#7e2a1c"/>
    </linearGradient>
    <pattern id="pixGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.7" cy="1.7" r="0.7" fill="#f2e6cf"/>
    </pattern>
    <clipPath id="sealClip">
      <rect x="2" y="2" width="92" height="92" rx="12"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="12" fill="url(#sealGrad)"/>
  <g clip-path="url(#sealClip)">
    <rect x="2" y="2" width="92" height="92" fill="url(#pixGrid)" opacity="0.12"/>
  </g>
  <rect x="9" y="9" width="78" height="78" rx="7" fill="none" stroke="#f2e6cf" stroke-width="1.5" opacity="0.8"/>

  <text x="31" y="42" font-family="Noto Serif SC, SimSun, serif" font-size="32" fill="#fdf5e4" text-anchor="middle">数</text>
  <text x="65" y="42" font-family="Noto Serif SC, SimSun, serif" font-size="32" fill="#fdf5e4" text-anchor="middle">字</text>
  <text x="31" y="76" font-family="Noto Serif SC, SimSun, serif" font-size="32" fill="#fdf5e4" text-anchor="middle">怀</text>
  <text x="65" y="76" font-family="Noto Serif SC, SimSun, serif" font-size="32" fill="#fdf5e4" text-anchor="middle">仁</text>

  <g fill="#dcc48a">
    <rect x="78" y="12" width="4" height="4" opacity="0.95"/>
    <rect x="83" y="17" width="4" height="4" opacity="0.65"/>
    <rect x="12" y="80" width="4" height="4" opacity="0.65"/>
    <rect x="17" y="75" width="4" height="4" opacity="0.95"/>
  </g>
</svg>